name: little_steps
description: "小步 Little Steps：孩子自己決定、自己做到的成長 App。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_functions: ^7.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  firebase_app_check: ^0.5.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  integration_test:
    sdk: flutter
  analyzer: ^14.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/copy_rules.json
    - assets/crisis_patterns.json
